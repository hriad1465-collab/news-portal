<!-- NEWS DETAILS, ADVERTISEMENT & SOCIAL SHARE -->

<style>
.news-detail-page {
  max-width: 900px;
  margin: 30px auto;
  padding: 20px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 15px rgba(0,0,0,.08);
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  color: #222;
}

.news-detail-page h1 {
  font-size: 30px;
  line-height: 1.6;
  margin: 15px 0;
}

.news-detail-page .news-meta {
  color: #777;
  margin-bottom: 20px;
}

.news-detail-page .news-cover {
  width: 100%;
  max-height: 520px;
  object-fit: contain;
  border-radius: 8px;
  background: #eee;
}

.news-detail-page .news-content {
  font-size: 19px;
  line-height: 2;
  white-space: pre-wrap;
  margin-top: 25px;
}

.news-ad {
  background: #f5f5f5;
  border: 1px dashed #aaa;
  padding: 25px 10px;
  text-align: center;
  margin: 25px 0;
  color: #777;
  min-height: 80px;
}

.news-share {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 25px 0;
}

.news-share a,
.news-share button {
  padding: 12px 18px;
  border: 0;
  border-radius: 5px;
  color: white;
  text-decoration: none;
  cursor: pointer;
  font-size: 15px;
}

.facebook-share { background: #1877f2; }
.whatsapp-share { background: #168b45; }
.copy-share { background: #555; }

.back-news {
  display: inline-block;
  color: #b5121b;
  font-weight: bold;
  margin-bottom: 15px;
  text-decoration: none;
}

@media(max-width:600px) {
  .news-detail-page { margin: 10px; padding: 15px; }
  .news-detail-page h1 { font-size: 23px; }
  .news-detail-page .news-content { font-size: 17px; }
}
</style>

<script>
(function () {

  const path = window.location.pathname;
  const match = path.match(/^\/news\/([^/]+)\/?$/);

  // শুধু বিস্তারিত খবরের পৃষ্ঠায় কাজ করবে
  if (!match) return;

  const slug = decodeURIComponent(match[1]);

  document.body.innerHTML = `
    <div class="news-detail-page">
      <a href="/" class="back-news">← হোমপেজে ফিরে যান</a>
      <div id="newsDetails">খবর লোড হচ্ছে...</div>
    </div>
  `;

  async function loadNewsDetails() {
    const container = document.getElementById("newsDetails");

    try {
      const response = await fetch(
        "/api/news/" + encodeURIComponent(slug)
      );

      if (!response.ok) {
        throw new Error("খবরটি পাওয়া যায়নি");
      }

      const news = await response.json();

      const image =
        news.cover_url ||
        news.coverUrl ||
        news.image_url ||
        news.imageUrl ||
        news.image ||
        "";

      const title = news.title || "";
      const content = news.content || "";
      const author = news.author || "ডেস্ক রিপোর্ট";

      const date = news.created_at
        ? new Date(news.created_at).toLocaleDateString("bn-BD")
        : "";

      const currentUrl = window.location.href;

      const facebookUrl =
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(currentUrl);

      const whatsappUrl =
        "https://api.whatsapp.com/send?text=" +
        encodeURIComponent(title + " " + currentUrl);

      container.innerHTML = `
        <span style="
          background:#fff0f0;
          color:#b5121b;
          padding:7px 13px;
          border-radius:5px;
        ">${escapeHTML(news.category || "জাতীয়")}</span>

        <h1>${escapeHTML(title)}</h1>

        <div class="news-meta">
          লেখক: ${escapeHTML(author)}
          ${date ? " | প্রকাশিত: " + escapeHTML(date) : ""}
        </div>

        ${image ? `
          <img
            class="news-cover"
            src="${escapeHTML(image)}"
            alt="${escapeHTML(title)}"
          >
        ` : ""}

        <div class="news-ad">
          বিজ্ঞাপনের জন্য যোগাযোগ করুন
        </div>

        <div class="news-content">
          ${escapeHTML(content)}
        </div>

        <div class="news-ad">
          বিজ্ঞাপনের জায়গা
        </div>

        <h3>খবরটি শেয়ার করুন</h3>

        <div class="news-share">
          <a class="facebook-share"
             href="${facebookUrl}"
             target="_blank"
             rel="noopener">
             Facebook Share
          </a>

          <a class="whatsapp-share"
             href="${whatsappUrl}"
             target="_blank"
             rel="noopener">
             WhatsApp Share
          </a>

          <button class="copy-share" id="copyNewsLink">
            Copy Link
          </button>
        </div>
      `;

      document.title = title + " | প্রতিদিন বাংলাদেশ";

      document.getElementById("copyNewsLink")
        .addEventListener("click", async function () {
          try {
            await navigator.clipboard.writeText(currentUrl);
            this.textContent = "লিংক কপি হয়েছে";
          } catch (error) {
            prompt("এই লিংকটি কপি করুন:", currentUrl);
          }
        });

    } catch (error) {
      container.innerHTML = `
        <h2>দুঃখিত!</h2>
        <p>${escapeHTML(error.message)}</p>
        <a href="/">হোমপেজে ফিরে যান</a>
      `;
    }
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function (char) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char];
    });
  }

  loadNewsDetails();

})();
</script>
