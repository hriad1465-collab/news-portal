
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | প্রতিদিন বাংলাদেশ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f3f4f6;color:#222}
header{background:#b5121b;color:white;padding:18px 25px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0;font-size:21px}
.container{max-width:1100px;margin:25px auto;padding:0 15px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
button{border:0;padding:11px 17px;border-radius:5px;cursor:pointer;font-weight:bold}
.tab{background:#ddd}
.tab.active,.primary{background:#b5121b;color:white}
.card{background:white;padding:22px;border-radius:9px;box-shadow:0 2px 10px #0000000c;margin-bottom:20px}
input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccc;border-radius:5px;font-size:15px}
textarea{min-height:110px;resize:vertical}
label{font-weight:bold}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
th{background:#f5f5f5}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.danger{background:#dc3545;color:white}
.secondary{background:#555;color:white}
#dashboard{display:none}
#message{margin:12px 0;font-weight:bold}
.hidden{display:none}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.card{padding:15px}table{font-size:13px}}
</style>
</head>
<body>

<header>
  <h2>প্রতিদিন বাংলাদেশ — Admin</h2>
  <button class="secondary" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div id="loginBox" class="card" style="max-width:420px;margin:60px auto">
    <h2>Admin Login</h2>
    <label>ইমেইল / ইউজারনেম</label>
    <input id="username" placeholder="Admin username">
    <label>পাসওয়ার্ড</label>
    <input id="password" type="password" placeholder="Password">
    <button class="primary" style="width:100%" onclick="login()">Login</button>
    <div id="loginMessage"></div>
  </div>

  <div id="dashboard">
    <div class="tabs">
      <button class="tab active" onclick="showTab('add',this)">নিউজ প্রকাশ</button>
      <button class="tab" onclick="showTab('list',this)">নিউজ তালিকা</button>
    </div>

    <section id="addSection" class="card">
      <h2 id="formTitle">নতুন নিউজ প্রকাশ করুন</h2>
      <input type="hidden" id="newsId">

      <label>নিউজের শিরোনাম</label>
      <input id="title" placeholder="নিউজের শিরোনাম লিখুন">

      <div class="form-grid">
        <div>
          <label>বিভাগ</label>
          <select id="category">
            <option value="জাতীয়">জাতীয়</option>
            <option value="রাজনীতি">রাজনীতি</option>
            <option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
            <option value="খেলাধুলা">খেলাধুলা</option>
            <option value="বিনোদন">বিনোদন</option>
            <option value="শিক্ষা">শিক্ষা</option>
            <option value="অর্থনীতি">অর্থনীতি</option>
            <option value="প্রযুক্তি">প্রযুক্তি</option>
          </select>
        </div>
        <div>
          <label>লেখকের নাম</label>
          <input id="author" placeholder="লেখকের নাম">
        </div>
      </div>

      <label>ছবির URL</label>
      <input id="image" placeholder="https://example.com/image.jpg">

      <label>নিউজের বিস্তারিত</label>
      <textarea id="content" placeholder="নিউজের সম্পূর্ণ বিবরণ লিখুন"></textarea>

      <button class="primary" onclick="saveNews()">প্রকাশ করুন</button>
      <button class="secondary" onclick="resetForm()">ফর্ম পরিষ্কার</button>
      <div id="message"></div>
    </section>

    <section id="listSection" class="card hidden">
      <h2>প্রকাশিত নিউজ</h2>
      <button class="primary" onclick="loadNews()">Refresh</button>
      <div style="overflow-x:auto;margin-top:15px">
        <table>
          <thead>
            <tr><th>শিরোনাম</th><th>বিভাগ</th><th>Action</th></tr>
          </thead>
          <tbody id="newsTable">
            <tr><td colspan="3">নিউজ লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<script>
let token = localStorage.getItem("adminToken") || "";

function showMessage(id,text,color="red"){
  const el=document.getElementById(id);
  el.textContent=text;
  el.style.color=color;
}

function showDashboard(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  loadNews();
}

async function login(){
  const username=document.getElementById("username").value.trim();
  const password=document.getElementById("password").value;

  if(!username || !password){
    showMessage("loginMessage","ইউজারনেম ও পাসওয়ার্ড দিন");
    return;
  }

  try{
    const response=await fetch("/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const data=await response.json();

    if(!response.ok) throw new Error(data.message || data.error || "Login failed");

    token=data.token || data.accessToken;
    if(!token) throw new Error("সার্ভার থেকে login token পাওয়া যায়নি");

    localStorage.setItem("adminToken",token);
    showDashboard();
  }catch(error){
    showMessage("loginMessage",error.message);
  }
}

function authHeaders(){
  return {
    "Content-Type":"application/json",
    "Authorization":"Bearer "+token
  };
}

async function loadNews(){
  const tbody=document.getElementById("newsTable");
  tbody.innerHTML="<tr><td colspan='3'>লোড হচ্ছে...</td></tr>";

  try{
    const response=await fetch("/api/admin/news",{headers:authHeaders()});
    const data=await response.json();

    if(!response.ok) throw new Error(data.message || data.error || "নিউজ লোড হয়নি");

    const news=Array.isArray(data)?data:(data.news || data.data || []);
    tbody.innerHTML="";

    if(!news.length){
      tbody.innerHTML="<tr><td colspan='3'>কোনো নিউজ পাওয়া যায়নি</td></tr>";
      return;
    }

    news.forEach(item=>{
      const tr=document.createElement("tr");
      const title=document.createElement("td");
      const category=document.createElement("td");
      const actions=document.createElement("td");
      const edit=document.createElement("button");
      const del=document.createElement("button");

      title.textContent=item.title || "";
      category.textContent=item.category || "";
      edit.textContent="Edit";
      edit.className="secondary";
      edit.onclick=()=>editNews(item);
      del.textContent="Delete";
      del.className="danger";
      del.onclick=()=>deleteNews(item.id || item._id);

      actions.append(edit,del);
      tr.append(title,category,actions);
      tbody.appendChild(tr);
    });
  }catch(error){
    tbody.innerHTML="";
    const tr=document.createElement("tr");
    const td=document.createElement("td");
    td.colSpan=3;
    td.textContent=error.message;
    tr.appendChild(td);
    tbody.appendChild(tr);
  }
}

async function saveNews(){
  const id=document.getElementById("newsId").value;
  const payload={
    title:document.getElementById("title").value.trim(),
    category:document.getElementById("category").value,
    author:document.getElementById("author").value.trim(),
    image:document.getElementById("image").value.trim(),
    content:document.getElementById("content").value.trim()
  };

  if(!payload.title || !payload.content){
    showMessage("message","শিরোনাম ও বিস্তারিত লিখুন");
    return;
  }

  try{
    const url=id?"/api/admin/news/"+encodeURIComponent(id):"/api/admin/news";
    const response=await fetch(url,{
      method:id?"PUT":"POST",
      headers:authHeaders(),
      body:JSON.stringify(payload)
    });
    const data=await response.json();

    if(!response.ok) throw new Error(data.message || data.error || "সংরক্ষণ করা যায়নি");

    showMessage("message",id?"নিউজ আপডেট হয়েছে":"নিউজ প্রকাশ হয়েছে","green");
    resetForm();
    loadNews();
  }catch(error){
    showMessage("message",error.message);
  }
}

function editNews(item){
  document.getElementById("newsId").value=item.id || item._id || "";
  document.getElementById("title").value=item.title || "";
  document.getElementById("category").value=item.category || "জাতীয়";
  document.getElementById("author").value=item.author || "";
  document.getElementById("image").value=item.image || item.imageUrl || item.thumbnail || "";
  document.getElementById("content").value=item.content || item.description || "";
  document.getElementById("formTitle").textContent="নিউজ এডিট করুন";
  showTab("add",document.querySelector(".tab"));
}

async function deleteNews(id){
  if(!id || !confirm("আপনি কি এই নিউজটি মুছে ফেলতে চান?")) return;

  try{
    const response=await fetch("/api/admin/news/"+encodeURIComponent(id),{
      method:"DELETE",
      headers:authHeaders()
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.message || data.error || "Delete failed");
    loadNews();
  }catch(error){
    alert(error.message);
  }
}

function resetForm(){
  ["newsId","title","author","image","content"].forEach(id=>{
    document.getElementById(id).value="";
  });
  document.getElementById("category").value="জাতীয়";
  document.getElementById("formTitle").textContent="নতুন নিউজ প্রকাশ করুন";
}

function showTab(tab,button){
  document.getElementById("addSection").classList.toggle("hidden",tab!=="add");
  document.getElementById("listSection").classList.toggle("hidden",tab!=="list");
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  if(button) button.classList.add("active");
}

function logout(){
  localStorage.removeItem("adminToken");
  token="";
  location.reload();
}

if(token) showDashboard();
</script>
</body>
</html>
